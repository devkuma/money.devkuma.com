<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">박스권 차트의 지지 구간과 저항 구간</title>
  <desc id="desc">주가가 지지 구간과 저항 구간 사이에서 반복적으로 오르내리는 모습을 나타낸 예시 차트</desc>
  <rect width="1200" height="620" fill="#ffffff"/>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="100" y1="100" x2="1120" y2="100"/>
    <line x1="100" y1="200" x2="1120" y2="200"/>
    <line x1="100" y1="300" x2="1120" y2="300"/>
    <line x1="100" y1="400" x2="1120" y2="400"/>
    <line x1="100" y1="500" x2="1120" y2="500"/>
  </g>
  <rect x="100" y="132" width="1020" height="56" rx="12" fill="#fee2e2"/>
  <rect x="100" y="422" width="1020" height="56" rx="12" fill="#dbeafe"/>
  <text x="120" y="168" fill="#b91c1c" font-family="Arial, sans-serif" font-size="28" font-weight="700">저항 구간: 매도 물량이 늘기 쉬운 가격대</text>
  <text x="120" y="458" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="28" font-weight="700">지지 구간: 매수세가 유입되기 쉬운 가격대</text>
  <polyline points="120,450 205,365 290,185 380,270 470,438 560,345 650,172 740,255 835,445 930,350 1020,178 1100,248"
    fill="none" stroke="#111827" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#111827">
    <circle cx="290" cy="185" r="11"/>
    <circle cx="470" cy="438" r="11"/>
    <circle cx="650" cy="172" r="11"/>
    <circle cx="835" cy="445" r="11"/>
    <circle cx="1020" cy="178" r="11"/>
  </g>
  <text x="100" y="565" fill="#4b5563" font-family="Arial, sans-serif" font-size="24">선 하나에 맞추기보다 가격이 여러 번 반응한 범위를 구간으로 표시한다.</text>
</svg>
